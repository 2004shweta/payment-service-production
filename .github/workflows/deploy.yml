name: Deploy Payment Service

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-southeast-2 |
          docker login --username AWS --password-stdin 035409784853.dkr.ecr.ap-southeast-2.amazonaws.com

      - name: Pull latest image
        run: |
          docker pull 035409784853.dkr.ecr.ap-southeast-2.amazonaws.com/payment-service:latest

      - name: Deploy application
        run: |
          cd "$GITHUB_WORKSPACE"
          docker compose -f docker-compose.aws.yml up -d --no-build

      - name: Verify deployment
        run: |
          sleep 15
          curl --fail http://localhost:8080/api/v1/health
